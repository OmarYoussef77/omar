[project]
name = "tracking-agent"
version = "0.1.0"
description = "Claude-powered agent that sets up ad-platform tracking (GTM + Shopify) for GA4, Google Ads, Meta, TikTok, Snapchat and LinkedIn."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gtm = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
tracking-agent = "tracking_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracking_agent"]
